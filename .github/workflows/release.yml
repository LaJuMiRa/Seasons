name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon runner (arm64). macos-26 is generally available since February 2026.
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3 (got $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          if [[ "$(tr -d '[:space:]' < VERSION)" != "$VERSION" ]]; then
            echo "VERSION file does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build and package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)"
          printf '%s\n\nSHA-256: `%s`\n' "$NOTES" "${{ steps.package.outputs.sha256 }}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.zip }}" \
            "${{ steps.package.outputs.zip }}.sha256" \
            --title "Seasons $VERSION" \
            --notes-file release-notes.md
